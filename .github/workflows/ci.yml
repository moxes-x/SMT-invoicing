name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://invoicing:invoicing@localhost:5432/invoicing
  SECRET_KEY: ci-not-secret

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: invoicing, POSTGRES_USER: invoicing, POSTGRES_PASSWORD: invoicing }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U invoicing" --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - name: WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - name: OpenAPI schema is up to date
        run: uv run python manage.py spectacular --file openapi.yml && git diff --exit-code openapi.yml

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm gen:api && git diff --exit-code src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: invoicing, POSTGRES_USER: invoicing, POSTGRES_PASSWORD: invoicing }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U invoicing" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pnpm/action-setup@v4
        with: { package_json_file: frontend/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start fake Lenco
        working-directory: e2e
        run: node fake-lenco.mjs &
      - name: Start fake ZRA VSDC
        working-directory: e2e
        run: node fake-vsdc.mjs &
      - name: Start backend
        working-directory: backend
        run: |
          uv sync --frozen
          uv run python manage.py migrate
          DEBUG=1 AUTH_THROTTLE_RATE=1000/min LENCO_SANDBOX_API_URL=http://localhost:8090/access/v2 uv run python manage.py runserver 8000 &
      - name: Start frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm dev &
          npx --yes wait-on@8 http://localhost:5173 http://localhost:8000/api/health/
      - name: Playwright
        working-directory: e2e
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
