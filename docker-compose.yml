# Local development stack: `docker compose up`, then open http://localhost:5173
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: invoicing
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment: &backend-env
      DEBUG: "1"
      SECRET_KEY: dev-only-not-secret
      DATABASE_URL: postgres://invoicing:invoicing@db:5432/invoicing
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: celery -A config worker -l info
    environment: *backend-env
    volumes: ["./backend:/app"]
    depends_on: [backend, redis]

  frontend:
    build: ./frontend
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
