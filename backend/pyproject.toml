[project]
name = "invoicing-backend"
version = "0.1.0"
description = "Invoicing tool for Zambian small businesses (Django + DRF)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "gunicorn>=23",
    "whitenoise>=6.8",
    "phonenumbers>=8.13",
    "weasyprint>=70.0",
    "django-anymail[resend]>=15.2",
    "django-storages>=1.14.6",
    "httpx>=0.28.1",
    "cryptography>=50.0.2",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "factory-boy>=3.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "pre-commit>=4",
    "time-machine>=3.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"config/settings.py" = ["S105"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
ignore_missing_imports = true
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"
