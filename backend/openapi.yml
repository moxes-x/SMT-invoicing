  /api/customers/:
    get:
      operationId: customers_list
      description: |-
        Filters every queryset by request.business and stamps it on create.

        Objects of other businesses are simply invisible, so detail routes return 404 (not 403),
        which avoids leaking whether an id exists.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomerList'
          description: ''
    post:
      operationId: customers_create
      description: |-
        Filters every queryset by request.business and stamps it on create.

        Objects of other businesses are simply invisible, so detail routes return 404 (not 403),
