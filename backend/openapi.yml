components:
  schemas:
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        verb:
          $ref: '#/components/schemas/VerbEnum'
        message:
          type: string
          maxLength: 300
        actor_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - created_at
      - id
      - message
      - verb
    ActivityLogRequest:
      type: object
      properties:
        verb:
          $ref: '#/components/schemas/VerbEnum'
        message:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - message
      - verb
    Business:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 32
        address:
          type: string
        tpin:
          oneOf:
          - type: string
            pattern: ^\d{10}$
            maxLength: 10
          - type: string
            maxLength: 0
        vat_registered:
          type: boolean
          description: VAT-registered businesses must issue tax invoices via ZRA Smart
            Invoice.
        payment_details:
          type: string
          description: Bank / MTN MoMo / Airtel Money details printed on invoices.
        default_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        auto_reminders:
          type: boolean
        reminder_interval_days:
          type: integer
          maximum: 60
          minimum: 1
        max_reminders:
          type: integer
          maximum: 10
          minimum: 1
        role:
          type: string
          nullable: true
          readOnly: true
        compliance_notice:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - compliance_notice
