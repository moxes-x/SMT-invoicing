      enum:
      - sandbox
      - live
      type: string
      description: |-
        * `sandbox` - Sandbox (test)
        * `live` - Live
    ExchangeRateRequest:
      type: object
      properties:
        exchange_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
          description: Kwacha per 1 unit of the invoice currency, e.g. 26.85 for US$1
