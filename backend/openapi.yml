        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          description: |-
            Language of the messages and pages this customer gets

            * `en` - English
            * `bem` - Icibemba (Bemba)
            * `ny` - Chinyanja (Nyanja)
