        sdc_id:
          type: string
          readOnly: true
        mrc_no:
          type: string
          readOnly: true
        internal_data:
          type: string
          readOnly: true
        signature:
          type: string
          readOnly: true
        qr_url:
          type: string
          format: uri
          readOnly: true
        signed_at:
          type: string
          readOnly: true
