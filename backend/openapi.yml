          nullable: true
          readOnly: true
        compliance_notice:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - compliance_notice
      - created_at
      - id
      - name
      - role
    BusinessRequest:
