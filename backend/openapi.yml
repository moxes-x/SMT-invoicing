        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Business'
          description: ''
    patch:
      operationId: businesses_partial_update
      description: Businesses the user belongs to. Others are invisible (404), never
        forbidden (403).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - businesses
      requestBody:
        content:
          application/json:
