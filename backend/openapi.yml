      - whatsapp
      - email
      type: string
      description: |-
        * `whatsapp` - WhatsApp
        * `email` - Email
    DeliveryKindEnum:
      enum:
      - invoice
      - reminder
      - quote
      type: string
      description: |-
        * `invoice` - Invoice
        * `reminder` - Reminder
        * `quote` - Quote
    DeliveryStatusEnum:
      enum:
      - queued
      - shared
      - sent
      - delivered
      - read
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `shared` - Shared
        * `sent` - Sent
        * `delivered` - Delivered
        * `read` - Read
        * `failed` - Failed
