      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - draft
          - overdue
          - paid
          - partial
          - sent
          - unpaid
          - void
      tags:
