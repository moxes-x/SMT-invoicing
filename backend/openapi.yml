  /api/customers/{id}/statement/:
    get:
      operationId: customers_statement_retrieve
      description: Opening balance, invoices and payments in the period, running and
        closing balance.
      parameters:
      - in: query
        name: currency
        schema:
          type: string
          enum:
          - USD
          - ZMW
        description: 'Default: business currency'
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: 'Default: today'
      - in: path
        name: id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: 'Default: 90 days ago'
      tags:
      - customers
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
          description: ''
