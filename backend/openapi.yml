            Language of the messages and pages this customer gets

            * `en` - English
            * `bem` - Icibemba (Bemba)
            * `ny` - Chinyanja (Nyanja)
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
    CustomerRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        tpin:
          description: The customer's TPIN, printed on ZRA tax invoices (for business
