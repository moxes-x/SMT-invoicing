        tax_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,4})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - document_number
      - id
      - internal_data
      - kind
      - mrc_no
      - qr_url
      - receipt_no
      - sdc_id
      - signature
      - signed_at
      - tax_total
      - taxable_total
    FiscalReceiptKindEnum:
      enum:
      - sale
      - credit
      type: string
      description: |-
        * `sale` - Tax invoice
        * `credit` - Credit note
    FrequencyEnum:
      enum:
      - weekly
      - monthly
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
    Health:
