      - invoices
      - name
    Delivery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/DeliveryKindEnum'
          readOnly: true
        channel:
          allOf:
          - $ref: '#/components/schemas/DeliveryChannelEnum'
          readOnly: true
        recipient:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DeliveryStatusEnum'
          readOnly: true
        automatic:
          type: boolean
          readOnly: true
          description: Sent by a scheduled job
        error:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
