components:
  schemas:
    ActivityLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        verb:
          $ref: '#/components/schemas/VerbEnum'
        message:
          type: string
          maxLength: 300
        actor_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - created_at
      - id
      - message
      - verb
    ActivityLogRequest:
      type: object
      properties:
        verb:
          $ref: '#/components/schemas/VerbEnum'
        message:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - message
      - verb
    Aging:
      type: object
      properties:
        amount:
          type: integer
        count:
          type: integer
        bucket:
          type: string
        name:
          type: string
      required:
      - amount
      - bucket
      - count
      - name
    Amount:
      type: object
      properties:
        amount:
          type: integer
        count:
          type: integer
      required:
      - amount
      - count
    BlankEnum:
      enum:
      - ''
    Business:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 32
        address:
          type: string
        tpin:
          oneOf:
          - type: string
            pattern: ^\d{10}$
            maxLength: 10
          - type: string
            maxLength: 0
        vat_registered:
          type: boolean
          description: VAT-registered businesses must issue tax invoices via ZRA Smart
            Invoice.
        payment_details:
          type: string
          description: Bank / MTN MoMo / Airtel Money details printed on invoices.
        default_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        auto_reminders:
          type: boolean
        reminder_interval_days:
          type: integer
          maximum: 60
          minimum: 1
        max_reminders:
          type: integer
          maximum: 10
          minimum: 1
        role:
          type: string
          nullable: true
          readOnly: true
        compliance_notice:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - compliance_notice
      - created_at
      - id
      - name
      - role
    BusinessRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        phone:
          type: string
          maxLength: 32
        address:
          type: string
        tpin:
          oneOf:
          - type: string
            pattern: ^\d{10}$
            maxLength: 10
          - type: string
            maxLength: 0
        vat_registered:
          type: boolean
          description: VAT-registered businesses must issue tax invoices via ZRA Smart
            Invoice.
        payment_details:
          type: string
          description: Bank / MTN MoMo / Airtel Money details printed on invoices.
        default_currency:
          $ref: '#/components/schemas/CurrencyEnum'
        auto_reminders:
          type: boolean
        reminder_interval_days:
          type: integer
          maximum: 60
          minimum: 1
        max_reminders:
          type: integer
          maximum: 10
          minimum: 1
      required:
      - name
    Config:
      type: object
      properties:
        whatsapp_api:
          type: boolean
          description: Automatic WhatsApp sending is set up
        online_payments:
          type: boolean
          description: This business takes Pay now payments through Lenco
      required:
      - online_payments
      - whatsapp_api
    ConnectionTest:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required:
      - message
      - ok
    ConvertRequest:
      type: object
      properties:
        days_until_due:
          type: integer
          maximum: 120
          minimum: 0
          default: 14
    CurrencyEnum:
      enum:
      - ZMW
      - USD
      type: string
      description: |-
        * `ZMW` - Zambian Kwacha
        * `USD` - US Dollar
    CurrencyReport:
      type: object
      properties:
        currency:
          type: string
        invoiced:
          $ref: '#/components/schemas/Amount'
        collected:
          $ref: '#/components/schemas/Amount'
        outstanding:
          $ref: '#/components/schemas/Amount'
        overdue:
          $ref: '#/components/schemas/Amount'
        by_method:
          type: array
          items:
            $ref: '#/components/schemas/Method'
        aging:
          type: array
          items:
            $ref: '#/components/schemas/Aging'
        months:
          type: array
          items:
            $ref: '#/components/schemas/Month'
        top_customers:
          type: array
          items:
            $ref: '#/components/schemas/TopCustomer'
      required:
      - aging
      - by_method
      - collected
      - currency
      - invoiced
      - months
      - outstanding
      - overdue
      - top_customers
    Customer:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        phone:
          type: string
          maxLength: 32
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        address:
          type: string
        tpin:
          description: The customer's TPIN, printed on ZRA tax invoices (for business
