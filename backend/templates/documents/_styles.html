  <style>
    @page { size: A4; margin: 16mm 14mm; }
    :root { --ink:#1b1f24; --muted:#5f6b76; --line:#e3e6ea; --brand:#0f766e; --warn:#b45309; --bad:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.45 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:var(--ink); background:{% if pdf %}#fff{% else %}#f4f5f7{% endif %}; }
    .page { max-width: 760px; margin: 0 auto; background:#fff; padding: {% if pdf %}0{% else %}20px 16px 28px{% endif %}; }
    @media (min-width: 700px) { .page { {% if not pdf %}margin: 24px auto; padding: 36px 40px; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08);{% endif %} } }
    .top { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:flex-start; }
    h1 { font-size: 28px; margin: 0 0 2px; letter-spacing: .5px; }
    .muted { color: var(--muted); }
    .biz { font-weight: 600; font-size: 17px; }
    .badge { display:inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing:.4px; background:#eef2f3; }
    .badge.paid { background:#dcfce7; color:#166534; } .badge.overdue { background:#fee2e2; color:var(--bad); }
    .badge.partial { background:#fef3c7; color:var(--warn); } .badge.void { background:#e5e7eb; color:#374151; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 22px 0; }
    @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 2px; }
    table { width:100%; border-collapse: collapse; margin-top: 8px; }
    th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); border-bottom: 1px solid var(--line); padding: 8px 4px; }
    td { padding: 10px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .num { text-align:right; white-space:nowrap; }
    @media (max-width: 520px) { .hide-sm { display:none; } }
    .totals { margin-left:auto; width: 100%; max-width: 320px; margin-top: 12px; }
    .totals div { display:flex; justify-content:space-between; padding: 4px 0; }
    .totals .grand { font-size: 18px; font-weight: 700; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; }
    .totals .due { color: var(--brand); font-weight: 700; font-size: 18px; }
    .box { border:1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 22px; white-space: pre-line; }
    .banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-weight:600; }
    .banner.void { background:#f3f4f6; } .banner.draft { background:#fef3c7; }
    .actions { margin-top: 22px; }
    .btn { display:block; text-align:center; background: var(--brand); color:#fff; text-decoration:none; padding: 14px; border-radius: 8px; font-weight:600; }
    .fiscal { white-space: normal; }
    .fiscal table.vat { margin: 6px 0 12px; }
    .zra { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
    .zra-fields { min-width: 0; flex: 1 1 240px; font-size: 13px; display: grid; gap: 2px; }
    .zra .code { overflow-wrap: anywhere; font-family: ui-monospace, monospace; font-size: 11px; }
    .zra .qr svg { display: block; }
    footer { margin-top: 28px; font-size: 12px; }
    .pay { border:2px solid var(--brand); border-radius: 12px; padding: 16px; margin-top: 22px; }
    .pay h2 { font-size: 18px; margin: 0 0 4px; }
    .pay form { margin-top: 12px; display:grid; gap: 10px; }
    .ops { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .ops label { border:1px solid var(--line); border-radius: 8px; padding: 10px 4px; text-align:center; font-weight:600; cursor:pointer; }
    .ops input { position:absolute; opacity:0; }
    .ops label:has(input:checked) { border-color: var(--brand); background:#ecfdf5; }
    .field { display:grid; gap: 4px; font-size: 14px; }
    .field input { font: inherit; padding: 12px; border:1px solid var(--line); border-radius: 8px; }
    button.btn { width:100%; border:0; font: inherit; font-weight:600; cursor:pointer; }
    .btn.secondary { background:#fff; color: var(--ink); border:1px solid var(--line); }
    .or { text-align:center; color: var(--muted); font-size: 13px; margin: 6px 0; }
    .note { padding: 12px 14px; border-radius: 8px; background:#f3f4f6; margin-top: 16px; }
    .note.good { background:#dcfce7; color:#166534; font-weight:600; } .note.bad { background:#fee2e2; color: var(--bad); }
    .receipts a { color: var(--brand); }
  </style>
